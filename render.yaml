services:
  - type: web
    name: gemach-shchunati-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    startCommand: npx prisma migrate deploy && npm run ensure-admin && (npm run seed:demo || true) && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_NEIGHBORHOOD
        sync: false
      - key: SEED_DEMO
        sync: false
      - key: DEMO_USERS_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: FRONTEND_URL
        sync: false
