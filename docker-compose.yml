services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gemach
      POSTGRES_PASSWORD: gemach
      POSTGRES_DB: gemach
    ports:
      - "5433:5432"
    volumes:
      - gemach-db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

volumes:
  gemach-db-data:
